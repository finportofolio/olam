# Tirik olam katalogi: hayvonlar, qushlar, baliqlar, hasharotlar, o'simliklar, zamburug'lar (Wikidata).
name: Build living world catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 3 * *"
  push:
    branches: [main]
    paths:
      - scripts/build-life.mjs
      - .github/workflows/catalog-life.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: catalog-life
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build living world catalog
        run: node scripts/build-life.mjs
      - name: Check output
        run: |
          node -e 'const d=require("./assets/catalog/life/en.json"); if(d.total<10000){ console.error("too few: "+d.total); process.exit(1); } console.log("species:", d.total, JSON.stringify(d.counts))'
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/life
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update living world catalog"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "pages build request failed"
