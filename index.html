<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OLAM — Dunyoning eng go'zal joylari</title>
<meta name="description" content="OLAM — dunyoning eng go'zal joylari: rasmlar, Full HD videolar, AI gid, 10 tilda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f4f8fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OLAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* OLAM — oq + osmon ko'k. Yumshoq kartalar, suzuvchi menyu, Poppins shrifti */
:root{
  --sky:#2f8cf3; --sky2:#1a6fd6; --skyl:#e6f1ff; --sky3:#cfe4ff;
  --bg:#f4f8fd; --card:#ffffff; --line:#e7eef7;
  --text:#14233a; --mute:#8391a7; --star:#f5b301; --heart:#ff4d6d;
  --sh:0 10px 30px rgba(31,94,170,.10); --sh2:0 4px 14px rgba(31,94,170,.08);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav:84px; --page:#dfeaf7; --page:#dfeaf7; --page:#dfeaf7; --page:#dfeaf7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--page);color:var(--text);font-family:var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
.app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip;box-shadow:0 0 50px rgba(31,94,170,.12)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph{position:relative;overflow:hidden;background:#dbe7f5}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.08) contrast(1.04)}
.serif{font-family:var(--font)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ===== ONBOARDING ===== */
.ob{position:absolute;inset:0;z-index:100;background:#cfe4ff;display:none}
.ob.on{display:block}
.ob .bgl{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background-size:cover;background-position:center}
.ob .bgl.on{opacity:1;animation:kb 12s ease-out forwards}
.ob .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,40,80,.35) 0%,rgba(10,40,80,0) 30%)}
.ob .body{position:absolute;inset:auto 0 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;background:var(--card);border-radius:32px 32px 0 0;box-shadow:0 -10px 40px rgba(10,40,80,.18)}
.ob .body.splash{background:linear-gradient(180deg,rgba(5,20,40,0),rgba(5,20,40,.6) 45%);border-radius:0;box-shadow:none;color:#fff;padding-top:80px;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.ob .body.splash h1,.ob .body.splash .logo{color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.ob .body.splash p.sub{color:rgba(255,255,255,.92);text-shadow:0 1px 10px rgba(0,0,0,.4)}
.ob .steps{display:flex;gap:6px;margin-bottom:20px}
.ob .steps i{flex:1;height:4px;border-radius:4px;background:var(--skyl)}
.ob .steps i.on{background:var(--sky)}
.ob h1{font-weight:700;font-size:28px;line-height:1.15;margin-bottom:8px;letter-spacing:-.3px}
.ob p.sub{color:var(--mute);font-size:14.5px;line-height:1.55;margin-bottom:18px}
.ob .logo{font-size:15px;font-weight:600;letter-spacing:6px;margin-bottom:10px;opacity:.95}
.ob label.f{display:block;font-size:13px;color:var(--mute);margin:14px 0 8px;font-weight:500}
.ob input.t{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--text);font-size:16px;outline:0}
.ob input.t:focus{border-color:var(--sky);background:var(--card)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 15px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);font-size:14px;font-weight:500;transition:.15s}
.opt.on{background:var(--sky);color:#fff;border-color:var(--sky);box-shadow:0 6px 16px rgba(47,140,243,.3)}
.dream{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.dream .ph{aspect-ratio:3/4;border-radius:16px;cursor:pointer;border:3px solid transparent}
.dream .ph.on{border-color:var(--sky)}
.dream .ph span{position:absolute;left:8px;right:8px;bottom:7px;font-size:12px;font-weight:600;z-index:1;color:#fff;text-shadow:0 1px 6px #000}
.dream .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7))}
.obb{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:16px;border-radius:18px;font-weight:600;font-size:16px;text-align:center}
.btn.g{background:var(--sky);color:#fff;box-shadow:0 10px 24px rgba(47,140,243,.35)}
.btn.g:disabled{opacity:.4;box-shadow:none}
.btn.o{flex:0 0 auto;padding:16px 20px;background:var(--bg);color:var(--text)}

/* ===== VIEWS ===== */
.view{position:absolute;inset:0;overflow-y:auto;display:none;scrollbar-width:none;overscroll-behavior:contain;padding-bottom:var(--nav)}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}
#home{background:linear-gradient(180deg,#d7eaff 0%,#eaf3fe 260px,var(--bg) 520px)}
#watch{inset:0;overflow:hidden;background:#000;color:#fff;padding-bottom:0}

/* floating nav */
.nav{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:8px;background:rgba(255,255,255,.96);border-radius:999px;box-shadow:0 12px 34px rgba(20,60,120,.18);z-index:30}
.nav button{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#5d6b82;background:var(--bg);font-size:0;transition:.2s}
.nav button svg{width:22px;height:22px}
.nav button.on{background:var(--sky);color:#fff;box-shadow:0 6px 16px rgba(47,140,243,.4)}
.nav button.on svg path[d^="M8 5"]{fill:#fff}

/* home header */
.hd{display:flex;align-items:center;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 20px 6px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#5fb0ff,var(--sky2));color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(47,140,243,.35);flex:0 0 auto}
.hd b{display:block;font-size:17px;font-weight:600}
.hd small{color:var(--mute);font-size:13px}
.hd .ibtn{margin-left:auto}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh2);flex:0 0 auto;font-size:19px}
.sbar{display:flex;gap:10px;padding:14px 20px 4px}
.sin{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:0 16px;height:52px;box-shadow:var(--sh2);color:var(--mute);font-size:14px;cursor:pointer}
.sin svg{width:20px;height:20px}
.sfil{width:52px;height:52px;border-radius:18px;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(47,140,243,.35);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 20px 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--text)}
.tile i{width:60px;height:60px;border-radius:20px;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh2);color:var(--sky);font-style:normal}
.tile i svg{width:24px;height:24px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:24px 20px 12px}
.sec h2{font-size:18px;font-weight:600;letter-spacing:-.2px}
.sec span{color:var(--sky);font-size:13px;font-weight:500;cursor:pointer}
.sec small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px;letter-spacing:0}
.dchips{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 14px 6px 6px;box-shadow:var(--sh2);font-size:13px;font-weight:500}
.dchip .ph{width:34px;height:34px;border-radius:10px}
.feat{margin:6px 20px 0;height:340px;border-radius:28px;cursor:pointer;box-shadow:var(--sh)}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(5,25,55,.78))}
.feat .fi{position:absolute;left:20px;right:20px;bottom:20px;z-index:1;color:#fff}
.feat .badge{position:absolute;top:16px;left:16px;z-index:1;background:rgba(255,255,255,.92);color:var(--sky2);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}
.feat h1{font-size:28px;font-weight:700;line-height:1.1;margin-bottom:6px}
.feat p{font-size:13.5px;line-height:1.45;opacity:.92;margin-bottom:14px}
.kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sky);font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px}
.pill.g{background:var(--sky);color:#fff;box-shadow:0 8px 18px rgba(47,140,243,.35)}
.pill.g svg{fill:#fff;stroke:none;width:16px;height:16px}
.pill.o{background:rgba(255,255,255,.22);color:#fff}
.db .pill.o{background:var(--card);color:var(--text);box-shadow:var(--sh2)}
/* horizontal overlay cards */
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 20px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.card{flex:0 0 62%;aspect-ratio:4/5;border-radius:24px;scroll-snap-align:start;cursor:pointer;box-shadow:var(--sh)}
.card.sm{flex:0 0 40%;aspect-ratio:3/4;border-radius:20px}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(5,25,55,.75))}
.card .ci{position:absolute;left:14px;right:14px;bottom:14px;z-index:1;color:#fff}
.card b{font-size:17px;font-weight:600;display:block;line-height:1.2}
.card.sm b{font-size:14px}
.card small{opacity:.9;font-size:12px}
.card .tag{position:absolute;top:12px;left:12px;z-index:1;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);color:var(--sky2);padding:5px 10px;border-radius:999px}
/* 2-column grid cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
.gc{background:var(--card);border-radius:22px;padding:8px 8px 12px;box-shadow:var(--sh2);cursor:pointer;min-width:0}
.gc .gi{aspect-ratio:1/1;border-radius:16px}
.gc b{display:block;font-size:14.5px;font-weight:600;margin:10px 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .meta{display:flex;justify-content:space-between;gap:6px;margin:0 4px;font-size:12px;color:var(--mute)}
.gc .meta span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .meta .r{color:var(--text);font-weight:500;flex:0 0 auto}
.gc .meta .r:before{content:"★ ";color:var(--star)}
.hrt{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#9aa6b8}
.hrt svg{width:17px;height:17px}
.hrt.on{color:var(--heart)}
.hrt.on svg{fill:var(--heart)}
/* list items */
.li{display:flex;align-items:center;gap:14px;margin:0 20px 12px;background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--sh2);cursor:pointer}
.li .ph{flex:0 0 68px;height:68px;border-radius:14px}
.li b{display:block;font-size:15px;font-weight:600}
.li small{color:var(--mute);font-size:12.5px}
.li .go{margin-left:auto;width:42px;height:42px;border-radius:14px;background:var(--sky);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 14px rgba(47,140,243,.35)}
.li .go svg{width:18px;height:18px}
.foot{height:30px}

/* explore */
.xhead{padding:calc(20px + env(safe-area-inset-top)) 20px 4px}
.xhead h1{font-size:26px;font-weight:700;margin-bottom:14px;letter-spacing:-.3px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:0 16px;height:52px;box-shadow:var(--sh2)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:14px;background:var(--card);font-size:13px;font-weight:500;box-shadow:var(--sh2)}
.chip.on{background:var(--sky);color:#fff;box-shadow:0 6px 14px rgba(47,140,243,.35)}
.empty{padding:50px 30px;text-align:center;color:var(--mute);line-height:1.6}

/* watch (immersive) */
.layer{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
.layer.on{opacity:1}
.layer.kb{animation:kb 10s linear forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
#wv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s;transform:scale(1.02)}
#wv.on{animation:vz 12s linear forwards}
@keyframes vz{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.wnext{flex:1;margin:0 10px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wnext b{font-weight:600;color:#fff}
.wtop .ib.on{background:rgba(255,255,255,.25)}
#wv.on{opacity:1}
.wshade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),transparent 18%,transparent 55%,rgba(0,0,0,.75));pointer-events:none}
.wbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;height:3px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;z-index:3}
.wbar i{display:block;height:100%;width:0;background:var(--card)}
.wtop{position:absolute;top:calc(22px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.brand{font-size:16px;font-weight:700;letter-spacing:5px;color:#fff}
.wtop .ib{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.3);display:grid;place-items:center;color:#fff}
.wtap{position:absolute;inset:0;z-index:1}
.wtxt{position:absolute;left:20px;right:80px;bottom:calc(var(--nav) + 30px);z-index:2;pointer-events:none}
.wtxt .kicker{color:#a9d2ff}
.wtxt h2{font-size:34px;line-height:1.05;font-weight:700;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.wtxt p{color:#eef2f7;font-size:14px;margin-top:8px;line-height:1.45}
.wtxt.in>*{animation:rise .7s ease both}
.wtxt.in>*:nth-child(2){animation-delay:.08s}.wtxt.in>*:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wside{position:absolute;right:12px;bottom:calc(var(--nav) + 30px);z-index:3;display:flex;flex-direction:column;gap:14px}
.wside button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.wside button.on svg{fill:var(--heart);stroke:var(--heart)}
.wside button.sv.on svg{fill:#fff;stroke:#fff}
.paused{position:absolute;inset:0;display:none;place-items:center;z-index:2;pointer-events:none}
.paused.on{display:grid}
.paused div{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center}
.hint{position:absolute;left:0;right:0;top:46%;text-align:center;z-index:2;font-size:13px;color:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.hint.on{opacity:.85}

/* detail */
.detail{position:absolute;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;scrollbar-width:none}
.detail::-webkit-scrollbar{display:none}
.detail.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.dg{height:56vh;min-height:360px;position:relative;margin:calc(12px + env(safe-area-inset-top)) 14px 0;border-radius:30px;overflow:hidden;box-shadow:var(--sh)}
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;scroll-snap-align:start}
.dg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.22),transparent 22%);pointer-events:none}
.dg .x{position:absolute;top:14px;left:14px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--text);transform:rotate(90deg)}
.dg .cnt{position:absolute;top:22px;right:16px;z-index:3;font-size:12px;font-weight:500;background:rgba(255,255,255,.92);color:var(--text);padding:5px 11px;border-radius:999px}
.dt{padding:18px 22px 0}
.dt .kicker{font-size:11px}
.dt h1{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.3px}
.dt .loc{display:flex;justify-content:space-between;align-items:center;color:var(--mute);margin-top:6px;font-size:14px}
.dt .loc .r{color:var(--text);font-weight:600}
.dt .loc .r:before{content:"★ ";color:var(--star)}
.db{padding:14px 22px 0}
.db .row .pill{flex:1}
.tagline{font-size:15.5px;line-height:1.55;color:var(--text);font-weight:500;margin:18px 0 10px}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.facts div{background:var(--card);border-radius:16px;padding:11px;font-size:11px;color:var(--mute);box-shadow:var(--sh2)}
.facts b{display:block;color:var(--text);font-size:13px;margin-top:3px;font-weight:600}
.wiki{color:#55647a;line-height:1.65;font-size:13.5px}
.wiki small{display:block;margin-top:6px;color:var(--mute);font-size:11px}
.wiki small a{text-decoration:underline}
.rec{display:flex;gap:14px;margin:0 20px 12px;padding:10px;background:var(--card);border-radius:20px;box-shadow:var(--sh2);cursor:pointer;align-items:center}
.rec .ph{flex:0 0 96px;height:80px;border-radius:14px}
.rec b{font-size:15px;font-weight:600;display:block;margin-bottom:3px}
.rec small{color:var(--mute);font-size:12.5px;line-height:1.45;display:block}

/* profile */
.prof{padding:calc(30px + env(safe-area-inset-top)) 20px 4px;text-align:center}
.prof .av{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,#5fb0ff,var(--sky2));color:#fff;display:grid;place-items:center;font-size:36px;font-weight:700;box-shadow:0 10px 26px rgba(47,140,243,.35)}
.prof h1{font-size:24px;font-weight:700}
.prof p{color:var(--mute);font-size:13.5px;margin-top:4px}
.prof .opts{justify-content:center;margin-top:14px}
.prof .opt{padding:7px 12px;font-size:12.5px;background:var(--card);border:0;box-shadow:var(--sh2)}
.prof .opt.on{background:var(--sky)}
.reset{display:inline-block;margin:18px auto 0;color:var(--sky);font-size:13.5px;font-weight:600;background:var(--skyl);padding:10px 18px;border-radius:14px}
.toast{position:absolute;left:50%;bottom:calc(var(--nav) + 26px);transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:120;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}

/* chat (OLAM gid) */
.ask{width:100%;margin-top:12px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#5fb0ff,var(--sky2));color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 10px 22px rgba(47,140,243,.3)}
.hbtn{font-size:13px;background:rgba(0,0,0,.3);color:#fff;padding:6px 12px;border-radius:999px;margin-left:6px}
.hello{font-size:13px;color:#fff;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:999px}

/* AI hamma joyda */

.wfact.on{display:block;animation:rise .4s ease both}
.aisearch{display:block;margin:14px 20px 8px;width:calc(100% - 40px);padding:13px;border-radius:16px;background:var(--skyl);color:var(--sky2);font-weight:600;font-size:14px}
.ainote{margin:0 20px 12px;color:var(--mute);font-size:12.5px}

.obcap{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:2;background:rgba(255,255,255,.9);color:var(--text);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}
.chv{position:relative;flex:0 0 190px;overflow:hidden}
.chv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(244,248,253,1))}

.taste{margin:0 20px;padding:16px;background:var(--card);border-radius:24px;box-shadow:var(--sh2)}

.tb i{height:8px;border-radius:8px;background:var(--skyl);overflow:hidden;display:block}

.tb em{font-style:normal;color:var(--mute);text-align:right}
.ov{position:absolute;inset:0;z-index:45;background:var(--bg);display:none;overflow-y:auto}
.ov.on{display:block}
.ovx{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:1001;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--sh2);display:grid;place-items:center;transform:rotate(90deg)}
#mapc{position:absolute;inset:0;background:#dbe9f6}
.maptitle{position:absolute;top:calc(14px + env(safe-area-inset-top));left:68px;right:14px;z-index:1000;background:rgba(255,255,255,.95);border-radius:16px;padding:9px 14px;box-shadow:var(--sh2);font-weight:600;font-size:15px}
.maptitle small{display:block;color:var(--mute);font-weight:400;font-size:11.5px}
.mkw{width:44px;height:44px;display:grid;place-items:center}
.mk.dy{width:32px!important;height:32px!important;border-radius:50%!important;border-width:2px!important}
#mapc[data-z="2"] .mk,#mapc[data-z="3"] .mk{width:30px;height:30px;border-width:2px;border-radius:10px}
#mapc[data-z="4"] .mk{width:38px;height:38px}
.mk{width:44px;height:44px;border-radius:14px;transition:width .2s,height .2s;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(20,60,120,.35);position:relative}
.mk img{width:100%;height:100%;object-fit:cover;display:block}
.mapcard{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + 18px);z-index:1000;background:var(--card);border-radius:24px;padding:10px;box-shadow:var(--sh);display:none;gap:12px}

.mci{flex:0 0 96px;height:120px;border-radius:16px}

.qhead span{font-size:13px;color:var(--mute)}

.qo small{color:var(--mute);font-size:12px}
.qo.ok{border-color:#22c55e;background:#effdf3}
.qo.bad{border-color:#ef4444;background:#fef1f1}

.qmsg{font-weight:700;font-size:16px}
.qmsg.ok{color:#16a34a}.qmsg.bad{color:#dc2626}

function cyr(s){

  const AP="['‘’ʻʼ`]";
  return String(s).split(/(<[^>]*>|\{[a-z_]+\})/).map((part,i)=>{
    if(i%2) return part;
    let t=part
      .replace(new RegExp("O"+AP,"g"),"Ў").replace(new RegExp("o"+AP,"g"),"ў").replace(new RegExp("G"+AP,"g"),"Ғ").replace(new RegExp("g"+AP,"g"),"ғ")

      .replace(new RegExp(AP,"g"),"ъ");
    const M={A:"А",B:"Б",D:"Д",E:"Е",F:"Ф",G:"Г",H:"Ҳ",I:"И",J:"Ж",K:"К",L:"Л",M:"М",N:"Н",O:"О",P:"П",Q:"Қ",R:"Р",S:"С",T:"Т",U:"У",V:"В",X:"Х",Y:"Й",Z:"З",C:"С",W:"В",
      a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з",c:"с",w:"в"};

}

ori (XVII asr) — bitta maydonni o'rab turadi. Sherdor peshtoqidagi sher va quyosh tasviri butun dunyoga mashhur. Kechqurun yoritilgan maydon ayniqsa go'zal.","itchan":"Xivaning devor bilan o'ralgan ichki shahri — tirik muzey, YuNESKO ro'yxatidagi birinchi O'zbekiston obidasi. 50 dan ortiq tarixiy bino, Kalta minor va Islomxo'ja minorasi shu yerda. Quyosh botganda devorlar ustidan butun shahar oltin rangga kiradi.","kalon":"1127-yilda qurilgan 46 metrli Minorai Kalon Buxoroning ramzi — rivoyatlarga ko'ra, Chingizxon ham uni buzdirmagan. Atrofidagi Kalon masjidi va Mir Arab madrasasi bilan birga ajoyib ansambl hosil qiladi.","charvak":"Toshkentdan 80 km uzoqlikda, G'arbiy Tyan-Shan tog'lari orasidagi zangori suv ombori. Yozda suzish, qayiqda sayr va dam olish maskanlari, atrofda Chimyon va Beldersoy tog'lari bor.","issyk":"Dunyodagi eng katta tog' ko'llaridan biri — 1600 metr balandlikda, qishda ham muzlamaydi. Qorli cho'qqilar fonida tiniq suv, plyajlar va issiq buloqlar Markaziy Osiyoning sevimli dam olish joyiga aylantirgan.","charyn":"Olmaotadan 200 km sharqdagi 154 km uzunlikdagi kanyon. Eng mashhur qismi — «Qal'alar vodiysi», qizil qoyalar ertak qasrlarini eslatadi. Ko'pincha Amerikaning Katta kanyonining «kichik ukasi» deb ataladi.","santorini":"Egey dengizidagi vulqon oroli: qoya ustida oppoq uylar va ko'k gumbazli cherkovlar. Oia qishlog'idagi quyosh botishi dunyodagi eng chiroyli manzaralardan biri hisoblanadi.","eiffel":"1889-yilgi Butunjahon ko'rgazmasi uchun qurilgan 330 metrli temir minora — Parij va Fransiyaning ramzi. Tepasidan butun shahar ko'rinadi, kechasi har soat boshida minglab chiroqlar jimirlaydi.","machu":"And tog'larida, 2430 metr balandlikda qurilgan XV asr inklar shahri. Ispanlar uni topa olmagan, dunyo 1911-yilda bilib qolgan. Bulutlar orasidagi tosh shahar — Yangi 7 mo'jizadan biri.","maldives":"Hind okeanidagi 1192 ta marjon orolidan iborat davlat. Bembiyoz qum, tiniq zangori lagunalar va suv ustidagi villalar bilan dunyoning eng mashhur dengiz dam olish maskani.","fuji":"Yaponiyaning eng baland cho'qqisi (3776 m) va muqaddas ramzi — mukammal konus shaklidagi uxlab yotgan vulqon. Bahorda sakura gullari, kuzda qizil barglar fonida ayniqsa go'zal ko'rinadi.","burj":"828 metrli dunyodagi eng baland bino (2010). 148-qavatdagi kuzatuv maydonidan Dubay va cho'l ko'rinadi, pastida esa musiqali favvoralar shousi bo'lib o'tadi.","taj":"Shoh Jahon sevimli rafiqasi Mumtoz Mahal xotirasiga qurdirgan oq marmar maqbara (1632–1653). Temuriylar me'morchiligi an'analarini davom ettirgan — Yangi 7 mo'jizadan biri.","canyon":"Kolorado daryosi millionlab yillar davomida o'yib chiqargan 446 km uzunlikdagi va 1,8 km chuqurlikdagi kanyon. Qatlam-qatlam qizil qoyalar quyosh chiqishi va botishida rang o'zgartiradi.","wall":"Ming yillar davomida qurilgan, umumiy uzunligi 21 ming km dan ortiq mudofaa devori. Pekin yaqinidagi Mutianyu va Badaling qismlari eng chiroyli — Yangi 7 mo'jizadan biri.","cappadocia":"Turkiyaning markazidagi «peri mo'rilari» — vulqon tufidan hosil bo'lgan g'aroyib qoyalar va yer osti shaharlari. Tongda yuzlab havo sharlari bir vaqtda osmonga ko'tariladi.","venice":"118 ta orolda qurilgan, ko'chalari o'rnida kanallar bo'lgan shahar. Gondolalar, Avliyo Mark maydoni va Rialto ko'prigi — dunyodagi eng romantik shaharlardan biri.","petra":"Iordaniyadagi nabatiylarning 2000 yillik poytaxti — pushti qoyalarga o'yib ishlangan saroylar. Tor Siq darasidan o'tgach, ko'z oldingizda mashhur Al-Xazna paydo bo'ladi. Yangi 7 mo'jizadan biri.","wadirum":"«Oy vodiysi» deb ataluvchi qizil qumli cho'l va ulkan qoyalar. «Mars» va «Dyuna» filmlari shu yerda suratga olingan. Badaviylar chodirida tunab, yulduzli osmonni tomosha qilish mumkin.","borabora":"Tinch okeanidagi vulqon oroli: zumrad lagunasi va Otemanu tog'i. Suv ustidagi bungalolar va marjon riflari uni «Tinch okeanining marvaridi» qilgan.","banff":"Kanadaning birinchi milliy bog'i (1885) — Qoyali tog'lardagi firuza ko'llar. Peyto ko'li bo'ri boshi shaklida, rangini muzlik suvidagi mayda tosh changi beradi.","moraine":"O'nta cho'qqi vodiysidagi muzlik ko'li — rangi yozda yorqin firuza tusga kiradi. Kanada pul banknotida tasvirlangan manzara. Iyun–sentabrda borish mumkin.","colosseum":"Milodiy 80-yilda qurilgan, 50 ming tomoshabinga mo'ljallangan Rim amfiteatri. Gladiatorlar jangi bo'lgan bu bino — Yangi 7 mo'jizadan biri va Rimning eng mashhur ramzi.","kyoto":"Ming yildan ortiq Yaponiya poytaxti bo'lgan shahar: 1600 dan ortiq ibodatxona, Fushimi Inarining minglab qizil darvozalari va bambuk o'rmoni. Geyshalar mahallasi Gion ham shu yerda.","zhangjiajie":"Bulutlar orasidan ko'tarilgan minglab tosh ustunlar — «Avatar» filmidagi uchar tog'larga ilhom bergan. Dunyodagi eng baland tashqi lift va shisha ko'priklar bor.","iguazu":"Argentina va Braziliya chegarasidagi 275 ta sharshara tizimi. Eng kuchlisi — «Iblis tomog'i». Yangi tabiiy 7 mo'jizadan biri, Niagaradan deyarli ikki barobar keng.","angkor":"XII asrda qurilgan dunyodagi eng katta diniy inshoot (162 gektar). Quyosh chiqishida ko'lda aks etgan beshta minora — Kambodja bayrog'idagi ramz.","bali":"«Xudolar oroli» — sholi terrasalari, dengiz qoyasidagi Tanah Lot ibodatxonasi va jungli ichidagi sharsharalar. Ubud shahrida san'at va yoga, janubda esa sörf plyajlari.","lofoten":"Shimoliy qutb doirasidan narida, okeandan to'g'ridan-to'g'ri ko'tarilgan o'tkir cho'qqilar. Qizil baliqchi uylari, yozda yarim tungi quyosh, qishda shimoliy yog'du.","skogafoss":"Islandiyaning janubidagi 60 metrli, 25 metr kenglikdagi kuchli sharshara. Quyoshli kunlarda doimo kamalak ko'rinadi. Yonidagi zinapoyadan tepasiga chiqish mumkin.","sagrada":"Antoni Gaudí 1882-yilda boshlagan va hali ham qurilayotgan bazilika. Ichidagi rangli vitrajlar va daraxtsimon ustunlar o'rmon ichida turgandek his beradi.","plitvice":"16 ta firuza ko'l bir-biriga sharsharalar orqali quyiladi. Yog'och so'qmoqlar suv ustidan o'tadi. Xorvatiyaning eng qadimgi milliy bog'i va YuNESKO obidasi.","halong":"Zumrad suvdan ko'tarilgan 1600 dan ortiq ohaktosh orol. Rivoyatga ko'ra, ularni ajdar yaratgan. An'anaviy kemada tunab, g'orlarni ziyorat qilish mumkin.","hallstatt":"Alp ko'li bo'yidagi 7000 yillik tuz konchilari qishlog'i. Ertakdek uylar, tog'lar va ko'l manzarasi — dunyoda eng ko'p suratga olinadigan qishloqlardan biri.","pamukkale":"«Paxta qal'asi» — issiq buloqlardan hosil bo'lgan oppoq ohak terrasalar. Tepasida qadimgi Ierapolis shahri va Kleopatra hovuzi bor, unda suzish mumkin.","victoria":"Zambezi daryosi 108 metr chuqurlikka quladigan, 1,7 km keng sharshara. Mahalliy nomi — «Momaqaldiroq tutuni». Quruq mavsumda «Iblis hovuzi»da sharshara chetida suzish mumkin.","niagara":"AQSh va Kanada chegarasidagi uchta sharshara. Har soniyada 2800 kub metrgacha suv tushadi. «Maid of the Mist» kemasida sharshara tagiga yaqin borasiz.","uyuni":"10 ming kv.km lik dunyodagi eng katta sho'rxok. Yomg'irdan keyin yuzasi ulkan ko'zguga aylanadi va osmon bilan yer qo'shilib ketadi.","sydney":"Yelkanlarga o'xshash tomlari bilan XX asrning eng mashhur binosi (1973). Ichida yiliga 1500 dan ortiq konsert o'tadi. Sidney bandargohi va ko'prigi bilan ajoyib manzara.","milford":"Yangi Zelandiyadagi fyord: 1000 metrli qoyalardan sharsharalar tushadi, suvda delfin va tyulenlar suzadi. Redyard Kipling uni «dunyoning sakkizinchi mo'jizasi» deb atagan.","neuschwanstein":"Bavariya qiroli Lyudvig II qurdirgan ertak qasri (1869). Disneyning «Uyqudagi go'zal» qasriga ilhom bergan. Mariya ko'prigidan eng chiroyli ko'rinadi.","matterhorn":"4478 metrli piramida shaklidagi cho'qqi — Shveytsariya ramzi. Avtomobilsiz Zermatt shahridan ko'rinadi, Gornergrat poyezdida yaqinroq borish mumkin.","bled":"Alp tog'lari orasidagi ko'l o'rtasida kichik orol va cherkov, qoya ustida o'rta asr qal'asi. An'anaviy «pletna» qayig'ida orolga borib, qo'ng'iroq chalish odati bor.","dubrovnik":"«Adriatika marvaridi» — qizil tomli shahar 2 km lik devor bilan o'ralgan. «Taxtlar o'yini» seriali shu yerda suratga olingan. Devor ustidan dengiz manzarasi ajoyib.","amalfi":"Janubiy Italiyaning qoyalar ustiga terilgan rang-barang qishloqlari — Positano, Amalfi, Ravello. Limon bog'lari va moviy dengiz bo'ylab ilon izi yo'l.","cinqueterre":"Ligur dengizi qoyalaridagi beshta rang-barang baliqchi qishlog'i. Ular orasida so'qmoqlar va poyezd qatnaydi. Mashinalar kira olmaydi, shuning uchun tinch va go'zal.","prague":"«Yuz minorali shahar»: Karl ko'prigi, Praga qal'asi va 600 yillik astronomik soat. O'rta asr ko'chalari urushlarda deyarli zarar ko'rmagan.","montsaintmichel":"Dengiz to'lqinlari o'rab oladigan qoyali orol va VIII asrdan beri turgan abbatlik. Suv ko'tarilganda orolga aylanadi — Fransiyaning eng ko'p tashrif buyuriladigan joylaridan biri.","como":"Alp tog'lari etagidagi «Y» shaklidagi ko'l, qirg'og'ida hashamatli villalar va Bellajo qishlog'i. Ko'plab mashhur insonlar va filmlar uchun sevimli joy.","edinburgh":"So'ngan vulqon qoyasi ustidagi qal'a — Shotlandiyaning ramzi. Ichida Shotlandiya toji saqlanadi. Har avgustda dunyodagi eng katta san'at festivali o'tadi.","moher":"Atlantika okeaniga 214 metr balandlikdan qarab turgan 14 km lik qoyalar. Puffin qushlari uyasi va «Garri Potter» filmidagi g'or shu yerda.","lauterbrunnen":"72 ta sharsharali chuqur Alp vodiysi. Shtaubbax sharsharasi qishloq ustidan 300 metr balandlikdan tushadi. Tolkienning Rivendelliga ilhom bergan joy.","amsterdam":"165 kanal, 1500 ko'prik va tor qiyshiq uylar shahri. Velosipedlar odamlardan ko'p. Van Gog muzeyi va Anna Frank uyi shu yerda.","hagiasophia":"537-yilda qurilgan ulkan gumbazli bino — 900 yil cherkov, 500 yil masjid, keyin muzey bo'lgan, 2020-yildan yana masjid. Vizantiya va Usmonli san'atining durdonasi.","meteora":"Gretsiyada 400 metrli tosh ustunlar tepasiga qurilgan monastirlar. Ilgari ularga faqat arqon va savatda chiqilgan. «Meteora» — «osmonda muallaq» degani.","geiranger":"Norvegiyaning 15 km lik fyordi: tik qoyalardan «Yetti opa-singil» sharsharasi tushadi. YuNESKO obidasi, kruiz kemalarining sevimli manzili.","jokulsarlon":"Islandiyadagi muzlik ko'li: ko'k aysberglar okeanga suzib chiqadi. Yonidagi «Olmos plyaj»da qora qum ustida muz bo'laklari brilliantdek yaltiraydi.","budapest":"Dunay bo'yidagi neogotik Vengriya parlamenti — Yevropadagi eng chiroyli binolardan biri. Kechasi yoritilgan bino va Zanjirli ko'prik daryoda aks etadi.","towerbridge":"1894-yilda qurilgan, kemalar o'tishi uchun ko'tariladigan ko'prik — Londonning ramzi. Yuqori yo'lagida shisha pol bor.","everest":"Dunyodagi eng baland cho'qqi — 8849 metr. Birinchi marta 1953-yilda Hillari va Tenzing chiqqan. Nepaldagi bazaviy lagergacha piyoda sayohat ham mashhur.","petronas":"452 metrli egizak minoralar (1998), 41–42-qavatlarda osma ko'prik bilan ulangan. Islomiy sakkiz qirrali yulduz naqshi asosida loyihalangan.","marinabay":"Uchta 55 qavatli minora ustidagi kema shaklidagi bog' va dunyodagi eng mashhur «cheksiz hovuz». Kechasi lazer va suv shousi bo'ladi.","phiphi":"Andaman dengizidagi ohaktosh orollar. Mashhur Maya ko'rfazi «Plyaj» filmidan tanilgan. Tiniq suvda snorkeling va kayak uchun ajoyib.","bagan":"Irravadi daryosi bo'yidagi tekislikda 2000 dan ortiq qadimiy pagoda. Tongda havo sharlaridan qaraganda butun vodiy tuman ichida ko'rinadi.","bromo":"Indoneziyadagi faol vulqon — «qum dengizi» o'rtasida tutab turadi. Tongda Penanjakan nuqtasidan bulutlar ustidagi vulqonlar manzarasi ochiladi.","hongkong":"Viktoriya bandargohi bo'yidagi osmono'parlar o'rmoni. Har kecha «Yorug'lik simfoniyasi» shousi bo'ladi. Viktoriya cho'qqisidan shahar kaftdagidek ko'rinadi.","banaue":"2000 yildan ortiq avval Ifugao xalqi tog' yonbag'riga qo'lda qurgan sholi terrasalari. «Dunyoning sakkizinchi mo'jizasi» deb ataladi.","elnido":"Palavan orolidagi ohaktosh qoyalar, yashirin lagunalar va oq plyajlar. Orolma-orol qayiq sayohati eng mashhur mashg'ulot.","jiuzhaigou":"«To'qqiz qishloq vodiysi» — kamalak rangli ko'llar va sharsharalar. Suv shu qadar tiniqki, tubidagi daraxtlar ko'rinib turadi.","guilin":"Li daryosi bo'ylab sirli ohaktosh tog'lar — Xitoyning 20 yuanlik banknotida tasvirlangan. Bambuk sol yoki kemada sayr qilish eng yaxshi tanlov.","tigersnest":"Butanda 900 metrli qoya chetiga qurilgan monastir (1692). Rivoyatga ko'ra, Guru Rinpoche bu yerga yo'lbars ustida uchib kelgan. Piyoda 2–3 soatda chiqiladi.","tokyo":"Dunyodagi eng gavjum chorraha — bir vaqtda 3000 kishigacha kesib o'tadi. Neon chiroqlar, osmono'parlar va qadimiy ibodatxonalar uyg'unlashgan megapolis.","gergeti":"Kavkaz tog'larida 2170 metr balandlikdagi XIV asr cherkovi, ortida 5047 metrli Qozbek cho'qqisi. Gruziyaning eng mashhur manzarasi.","bigalmaty":"Olmaotadan 15 km yuqoridagi, 2511 metr balandlikdagi firuza tog' ko'li. Rangi fasl bo'yicha o'zgaradi — yashildan zangorigacha.","kaindy":"1911-yilgi zilziladan keyin hosil bo'lgan ko'l: suv ostidan qurigan archa daraxtlari ustunlardek chiqib turadi. Qishda muz ustidan daraxtlarni ko'rish mumkin.","sheikhzayed":"Abu-Dabidagi 82 gumbazli oppoq marmar masjid — 40 ming kishiga mo'ljallangan. Dunyodagi eng katta qo'lda to'qilgan gilam va ulkan qandillar shu yerda.","shahrisabz":"Amir Temur tug'ilgan shahar. Oqsaroyning 38 metrli peshtoqi qolgan qismi ham kishini hayratga soladi. Darvoza ustida «Kuchimizni bilmoqchi bo'lsang, binolarimizga boq» yozuvi bor.","gur":"Amir Temur va Temuriylar maqbarasi (1404). Qovurg'ali moviy gumbazi va oltin bilan bezatilgan ichki zali — Toj Mahal va Humoyun maqbarasiga ilhom bergan.","shahizinda":"«Tirik shoh» — XI–XIX asrlarga oid 20 dan ortiq maqbara bitta ko'chada. Moviy koshinlar va naqshlar ko'chasi — Samarqandning eng go'zal joylaridan biri.","yosemite":"Granit qoyalar (El Kapitan, Half Dome), sharsharalar va ulkan sekvoyalar vodiysi. Fevralda «Olovli sharshara» hodisasi kuzatiladi.","antelope":"Navaxo yerlaridagi tor kanyon — qum toshi to'lqinlari ichiga tushgan quyosh nurlari sehrli manzara yaratadi. Faqat mahalliy gid bilan kiriladi.","goldengate":"1937-yilda ochilgan 2,7 km lik osma ko'prik — San-Fransiskoning ramzi. Uning «xalqaro to'q sariq» rangi tuman ichida ham ko'rinib turadi.","manhattan":"Osmono'parlar oroli: Taymz-skver, Markaziy park, Bruklin ko'prigi va Broadway teatrlari. Dunyoning moliya va madaniyat markazlaridan biri.","yellowstone":"Dunyodagi birinchi milliy bog' (1872). Grand Prizmatik — kamalak rangli 110 metrli issiq buloq, Old Faithful geyzeri esa har 90 daqiqada otiladi.","torres":"Patagoniyadagi uchta granit «minora», moviy ko'llar va muzliklar. «W» so'qmog'i dunyodagi eng mashhur piyoda yo'llardan biri.","peritomoreno":"Uzunligi 30 km, balandligi 70 metrli muzlik — doimo harakatda. Ulkan muz bo'laklari momaqaldiroq ovozi bilan ko'lga qulaydi.","christ":"Korkovado tog'i tepasidagi 30 metrli Iso haykali (1931) — Yangi 7 mo'jizadan biri. Undan Rio-de-Janeyro, Shakar boshi tog'i va Kopakabana ko'rinadi.","chichenitza":"Mayya sivilizatsiyasining katta shahri. El Kastilyo ehromi — kalendar: bahor va kuz tengkunligida zinalarda ilon soyasi paydo bo'ladi. Yangi 7 mo'jizadan biri.","monumentvalley":"Navaxo yerlaridagi qizil qum toshi minoralari — vesternlar va «Forrest Gamp» filmidagi mashhur yo'l. Quyosh botishida ayniqsa go'zal.","horseshoe":"Kolorado daryosi taqa shaklida burilgan joy — 300 metr balandlikdagi qoya chetidan qaraladi. Katta kanyon yaqinidagi eng mashhur manzaralardan biri.","galapagos":"Ekvadordan 1000 km narida joylashgan orollar: ulkan toshbaqalar, dengiz iguanalari va qo'rqmas qushlar. Darvin evolyutsiya nazariyasini shu yerda ishlab chiqqan.","tulum":"Karib dengizi qoyasi ustidagi mayya qal'asi — oq qumli plyaj tepasida. Yaqinida senotlar — tiniq suvli yer osti hovuzlari bor.","angelfalls":"979 metr — dunyodagi eng baland sharshara. Venesuela junglisidagi stolsimon tog'dan tushadi, ko'pincha suv yerga yetmay tumanga aylanadi.","giza":"4500 yillik Xeops, Xefren va Mikerin ehromlari hamda Buyuk Sfinks. Qadimgi 7 mo'jizadan saqlanib qolgan yagona mo'jiza.","merzouga":"Marokashdagi Erg Shebbi — 150 metrgacha ko'tariladigan to'q sariq qum barxanlari. Tuyada sayr qilib, cho'l lagerida tunash mumkin.","chefchaouen":"Rif tog'laridagi «moviy shahar» — ko'chalari, eshik va devorlari ko'k rangga bo'yalgan. Har bir burchagi suratga olishga arziydi.","tablemountain":"Keyptaun ustida ko'tarilgan tekis cho'qqili tog' (1085 m). Aylanuvchi kanatda chiqiladi, tepasidan ikki okean qo'shilgan joy ko'rinadi.","serengeti":"Tanzaniyadagi cheksiz savanna — har yili 1,5 million gnu antilopasi va zebralarning «Buyuk ko'chishi» bo'ladi. Sher, fil va gepardlar makoni.","kilimanjaro":"Afrikaning eng baland cho'qqisi (5895 m) — ekvator yaqinidagi qorli vulqon. Maxsus jihozsiz chiqish mumkin bo'lgan eng baland tog'.","seychelles":"Hind okeanidagi orollar: Anse Source d'Argent plyajidagi pushti granit toshlar dunyodagi eng ko'p suratga olingan plyajlardan biri.","abusimbel":"Ramses II qoyaga o'ydirgan ikkita ulkan ibodatxona (miloddan avvalgi XIII asr). 1960-yillarda suv ostida qolmasligi uchun butunlay ko'chirilgan.","deadvlei":"Namib cho'lidagi oq gil maydon: 900 yillik qora o'lik daraxtlar, qizil barxanlar va moviy osmon — rasmga o'xshash manzara.","zanzibar":"Hind okeanidagi ziravorlar oroli: oq plyajlar, firuza suv va Tosh shahar (Stone Town) ko'chalari. Afrika, arab va hind madaniyati aralashgan.","barrierreef":"2300 km ga cho'zilgan dunyodagi eng katta marjon tizimi — kosmosdan ko'rinadi. 1500 xil baliq, toshbaqa va akulalar yashaydi.","uluru":"Avstraliya cho'li o'rtasidagi 348 metrli ulkan qizil qoya — aborigenlar uchun muqaddas. Quyosh botishida rangi qizildan binafshaga o'zgaradi.","twelveapostles":"Buyuk okean yo'li bo'yidagi dengizdan ko'tarilgan ohaktosh ustunlar. To'lqinlar ularni asta-sekin yemiradi — bugun 7 tasi qolgan.","aoraki":"Yangi Zelandiyaning eng baland cho'qqisi (3724 m). Tasman muzligi va Puqaki ko'lining firuza suvi bilan ajoyib manzara, yulduzli osmon qo'riqxonasi.","whitehaven":"Uitsandey orollaridagi 7 km lik oppoq plyaj — qumi 98% toza kremniydan iborat, issiqda ham qizimaydi. Hill Inlet ko'rfazida qum va suv naqsh hosil qiladi.","babylon":"Qadimgi 7 mo'jizadan biri — Navuxodonosor II qurdirgan pog'onali bog'lar. Aniq joyi hali ham bahsli, Iroqdagi Bobil xarobalarida izlari qidirilmoqda.","artemis":"Efes shahridagi 127 ustunli ulkan marmar ibodatxona. Miloddan avvalgi 356-yilda yondirilgan, bugun faqat bitta ustun qolgan. Qadimgi 7 mo'jizadan biri.","zeus":"Fidiy yaratgan 12 metrli oltin va fil suyagidan ishlangan Zevs haykali. Olimpiya shahrida turgan, keyinchalik yo'qolgan. Qadimgi 7 mo'jizadan biri.","halicarnassus":"Kariya hukmdori Mavsol uchun qurilgan 45 metrli maqbara — «mavzoley» so'zi shundan kelib chiqqan. Bugungi Bodrumda xarobalari saqlangan.","rhodes":"Rodos oroli bandargohidagi 33 metrli bronza quyosh xudosi Gelios haykali. Atigi 54 yil turib, zilziladan qulagan. Qadimgi 7 mo'jizadan biri.","alexandria":"Faros orolidagi 100 metrdan baland mayoq — ming yildan ortiq kemalarga yo'l ko'rsatgan. Qadimgi 7 mo'jizadan biri, o'rnida bugun Qaytbey qal'asi turibdi.","rioharbor":"Tog'lar, plyajlar va shahar uyg'unlashgan ko'rfaz: Shakar boshi tog'i, Kopakabana va Iso haykali. 7 tabiiy mo'jizadan biri.","aurora":"Quyosh shamoli atmosferaga urilib hosil qiladigan yashil va binafsha nurlar raqsi. Norvegiya, Islandiya va Finlyandiyada sentabr–mart oylarida ko'rish mumkin.","paricutin":"1943-yilda dehqon dalasida paydo bo'lgan va ko'z oldida 424 metrgacha o'sgan vulqon. Lava ostida qolgan cherkov minorasi hamon ko'rinib turadi.","amazon":"Dunyodagi eng katta tropik o'rmon — 5,5 million kv.km, sayyora kislorodining katta qismini beradi. Har o'ninchi hayvon turi shu yerda yashaydi.","jeju":"Janubiy Koreyaning vulqon oroli: Hallasan tog'i, lava g'orlari va Songsan Ilchulbong krateri. «Haenyo» — dengizga sho'ng'ivchi ayollar an'anasi mashhur.","komodo":"Dunyodagi eng katta kaltakesak — komodo ajdarlari yashaydigan orollar. Pushti plyaj va boy marjon riflari ham bor.","puertoprincesa":"Palavandagi 8 km lik yer osti daryosi to'g'ridan-to'g'ri dengizga quyiladi. Qayiqda stalaktitli g'or ichiga kirasiz. 7 tabiiy mo'jizadan biri.","campnou":"1957-yilda ochilgan «Barselona» stadioni — Yevropadagi eng katta (99 mingdan ortiq o'rindiq). Keng ko'lamli yangilanishdan so'ng 2025-yilda qayta ochildi. Ichidagi muzeyda klub kuboklari va Messining «Oltin to'p»lari saqlanadi.","bernabeu":"«Real Madrid»ning uyi — so'nggi yillarda yopiladigan tomi, 360 graduslik ekrani va o'zi yig'iladigan maysazori bilan dunyodagi eng zamonaviy stadionlardan biriga aylandi. Stadion turi va muzeyi mashhur.","wembley":"90 ming o'rindiqli Angliya terma jamoasining uyi. 133 metrli oq arkasi London ko'p joylaridan ko'rinadi. Chempionlar ligasi finallari va mashhur konsertlar shu yerda o'tadi.","maracana":"1950 va 2014-yilgi jahon chempionati finallari o'tgan Braziliya futbolining ibodatxonasi. 2016-yil Olimpiadasining ochilishi ham shu yerda bo'lgan.","allianz":"«Bavariya» stadioni — 2800 ta puflangan panel bilan qoplangan, kechasi qizil, ko'k yoki oq rangda yonadi. 75 ming o'rindiq, Myunxen chetida.","sansiro":"1926-yilda qurilgan, «Milan» va «Inter» bo'lishadigan 75 ming o'rindiqli stadion. Burchaklaridagi spiral minoralar uning ramzi. 2026-yilgi Qishki Olimpiada ochilishi shu yerda o'tdi.","oldtrafford":"«Manchester Yunayted» uyi — «Orzular teatri». Angliyadagi eng katta klub stadioni. Muzey va stadion turida klubning 140 yillik tarixini ko'rasiz.","anfield":"«Liverpul» stadioni — muxlislar «You'll Never Walk Alone» qo'shig'ini kuylaganda butun stadion titraydi. «Kop» tribunasi dunyoga mashhur.","signaliduna":"«Borussiya Dortmund» uyi — Germaniyadagi eng katta stadion (81 ming). Janubiy tribuna — 25 ming muxlisli «Sariq devor» Yevropadagi eng katta tik tribuna.","lusail":"Qatardagi 88 ming o'rindiqli arena — 2022-yilgi jahon chempionati finali (Argentina–Fransiya) shu yerda o'tgan. Oltin rangli fasadi arab fonuslaridan ilhomlangan.","birdsnest":"2008-yilgi Pekin Olimpiadasi uchun qurilgan po'lat to'rli stadion — qush uyasiga o'xshaydi. 2022-yilgi Qishki Olimpiada ochilishi ham shu yerda bo'lgan.","azteca":"Mexiko shahridagi afsonaviy stadion: 1970-yilda Pele, 1986-yilda Maradona («Xudo qo'li») chempion bo'lgan. 2026-yilgi jahon chempionatining ochilish o'yini ham shu yerda.","mcg":"1853-yildan beri ishlayotgan, 100 mingdan ortiq o'rindiqli stadion. Kriket va avstraliya futboli markazi, 1956-yilgi Olimpiada shu yerda o'tgan.","panathenaic":"Dunyodagi butunlay marmardan qurilgan yagona katta stadion. Miloddan avvalgi IV asrda qurilgan, 1896-yilda birinchi zamonaviy Olimpiada o'yinlari shu yerda o'tgan.","milliy":"Toshkentdagi 34 ming o'rindiqli zamonaviy futbol stadioni (2012) — O'zbekiston terma jamoasi va «Bunyodkor» uyi. Terma jamoaning jahon chempionati saralash o'yinlari shu yerda o'tgan.","pakhtakor":"1956-yilda qurilgan Toshkent markazidagi stadion — «Paxtakor» klubining uyi. Shahar markazida, Anhor bo'yidagi bog' ichida joylashgan.","sandiegozoo":"Balboa parkidagi 40 gektarlik hayvonot bog'i — 650 dan ortiq tur. Koala, pandalar va tropik o'rmon zonalari mashhur. Osma kanatdan butun bog'ni tepadan ko'rish mumkin.","singaporezoo":"Panjaralar o'rniga suv va tabiiy to'siqlardan foydalanadigan «ochiq» hayvonot bog'i. Orangutanlar bilan nonushta, Tungi safari va daryo safari mashhur.","berlinzoo":"1844-yilda ochilgan Germaniyaning eng qadimgi hayvonot bog'i — tur soni bo'yicha dunyoda eng boylaridan biri. Fil darvozasi va akvariumi mashhur.","schonbrunnzoo":"1752-yilda imperator saroyi bog'ida ochilgan dunyodagi eng qadimgi faol hayvonot bog'i. Pandalar, pingvinlar va barokko pavilyonlari bor.","bronxzoo":"Nyu-Yorkdagi 107 gektarlik hayvonot bog'i — AQShdagi eng kattalardan biri. «Kongo gorillalari o'rmoni» va yo'lbarslar tog'i zonalari mashhur.","tarongazoo":"Sidney bandargohi bo'yidagi hayvonot bog'i: jirafalar opera teatri va osmono'parlar fonida turadi. Paromda borib, kanat yo'lida ko'tarilasiz.","loroparque":"Tenerife orolidagi mashhur bog' — dunyodagi eng katta to'tiqush kolleksiyalaridan biri. Pingvinlar uchun muzli «Planet Penguin» va delfinlar shousi bor.","tashkentzoo":"Toshkentdagi 22 gektarlik hayvonot bog'i — 400 dan ortiq tur va 2000 ga yaqin hayvon. Fillar, yo'lbarslar va akvarium bor, bolalar bilan dam olish uchun qulay.","panda":"Chengdu shahridagi ulkan pandalarni ko'paytirish markazi. Ertalab borsangiz, pandalar bambuk yeyotgan va o'ynayotgan paytini ko'rasiz. Kichkina qizil pandalar ham bor.","georgiaaq":"Atlantadagi ulkan akvarium — kit akulalari va manta skatlari suzadigan 24 million litrlik hovuz. Suv osti tunnelidan o'tib, okean ichida yurgandek his qilasiz.","churaumi":"Okinavadagi akvarium: 7,5 million litrlik «Kurosio dengizi» hovuzida kit akulalari va manta skatlari suzadi. Oynasi dunyodagi eng kattalardan biri.","dubaiaq":"Dubay Mall ichidagi 10 million litrlik akvarium — 140 dan ortiq tur, akulalar va skatlar. 48 metrli suv osti tunnelidan o'tasiz, xohlasangiz akulalar bilan sho'ng'iysiz.","oceanografic":"Valensiyadagi Yevropaning eng katta akvariumi — har bir bino turli okean (Arktika, tropik dengizlar) ga bag'ishlangan. Belugalar va delfinlar shousi mashhur.","masaimara":"Keniyadagi qo'riqxona — iyul–oktabrda millionlab gnu va zebralar Mara daryosidan krokodillar orasidan o'tadi. Sherlar, gepardlar va masai qabilasi bilan uchrashuv.","kruger":"Janubiy Afrikadagi 2 million gektarlik safari bog'i — «Katta beshlik» (sher, fil, qoplon, karkidon, buyvol). O'z mashinangizda ham safari qilish mumkin.","ngorongoro":"Ulkan so'ngan vulqon krateri (diametri 20 km) ichidagi tabiiy «hayvonot bog'i» — sher, fil, karkidon va flamingolar bir joyda yashaydi.","louvre":"Dunyodagi eng katta va eng ko'p tashrif buyuriladigan muzey — 35 mingdan ortiq asar: «Mona Liza», «Venera Milosskaya», «Samofrakiya Nikasi». Kirish joyi — 1989-yilgi shisha piramida.","britishmuseum":"1753-yilda tashkil etilgan, 8 million eksponatli muzey: Rozetta toshi, Misr mumiyalari va Parfenon haykallari. Kirish bepul.","vatican":"Rim papalari to'plagan san'at xazinasi: Rafael xonalari va Mikelanjeloning Sikstin kapellasi shiftidagi freskalar. Mashhur spiral zinapoyasi bor.","hermitage":"Sankt-Peterburgdagi Qishki saroyda joylashgan muzey — 3 milliondan ortiq eksponat. Rembrandt, Leonardo da Vinchi asarlari va oltin «Tovus soat» shu yerda.","met":"Nyu-Yorkdagi Markaziy park yonidagi AQShning eng katta san'at muzeyi — 5000 yillik tarixni qamrab olgan 1,5 milliondan ortiq asar. Ichida butun Misr ibodatxonasi bor.","prado":"Madriddagi 1819-yilda ochilgan muzey — Velaskesning «Meninalar», Goyya va El Greko asarlari. Dunyodagi eng muhim san'at muzeylaridan biri.","uffizi":"Florensiyadagi Medichilar galereyasi — Botichellining «Veneraning tug'ilishi», Leonardo va Mikelanjelo asarlari. Uyg'onish davri san'atining eng katta to'plami.","orsay":"Sena bo'yidagi eski vokzal binosiga joylashgan muzey — impressionistlar: Mone, Van Gog, Renuar, Dega. Katta soat ortidan Luvr manzarasi ko'rinadi.","rijksmuseum":"Niderlandiyaning milliy muzeyi — Rembrandtning «Tungi qorovul» va Vermeerning «Sut quyayotgan ayol» asarlari. Binosi ostidan velosiped yo'li o'tadi.","museuminsel":"Berlindagi Shpree daryosi orolidagi beshta muzey: Pergamon, Neues (Nefertiti byusti), Bode va boshqalar. YuNESKO obidasi.","guggenheim":"Frenk Geri loyihasidagi titan bilan qoplangan to'lqinsimon muzey (1997). Bino shunchalik mashhurki, Bilbao shahrini dunyoga tanitdi. Oldida ulkan gulli it haykali turadi.","louvreabudhabi":"Jan Nuvel loyihasidagi muzey (2017) — 180 metrli to'rsimon gumbazdan quyosh nurlari «yorug'lik yomg'iri» bo'lib tushadi. Turli sivilizatsiyalar san'ati yonma-yon.","museumfuture":"Dubaydagi halqasimon bino (2022) — fasadidagi arab xattoti derazalar vazifasini bajaradi. Ichida kosmos, ekologiya va texnologiyaning kelajagi ko'rsatiladi.","gem":"Giza ehromlari yonidagi dunyodagi eng katta arxeologik muzey (2025). Tutanxamonning butun xazinasi, 11 metrli Ramses II haykali va ulkan zinapoya.","teamlab":"Tokiodagi raqamli san'at muzeyi: yalang oyoq suv ichida yurasiz, atrofingizda raqamli gullar va yorug'lik oqadi. Har bir xona — boshqa olam.","savitsky":"Nukusdagi Igor Savitskiy to'plagan 90 mingdan ortiq asar — Sovet davrida taqiqlangan rus avangardi san'atining dunyodagi eng katta to'plamlaridan biri. «Cho'ldagi Luvr» deb ataladi.","amirtemurmuseum":"Toshkent markazidagi moviy gumbazli muzey (1996) — Amir Temur va Temuriylar davri tarixi, qurollar, qo'lyozmalar va ajoyib ichki bezaklar.","airspace":"Vashingtondagi dunyodagi eng ko'p tashrif buyuriladigan muzeylardan biri: aka-uka Raytlarning birinchi samolyoti, «Apollon 11» kapsulasi va Oy toshi. Kirish bepul.","trinitylib":"Dublindagi Trinity kolleji kutubxonasi — 65 metrlik «Uzun zal»da 200 ming qadimiy kitob. IX asrga oid bezakli «Kells kitobi» shu yerda saqlanadi.","admont":"Avstriyadagi benediktinlar monastiri kutubxonasi (1776) — dunyodagi eng katta monastir kutubxonasi. Oq-oltin zal, freskalar va 70 ming kitob.","stuttgartlib":"Shtutgartdagi kub shaklidagi kutubxona (2011): ichida oppoq zinapoyali zal — xuddi ilmiy-fantastik filmdagidek. Tepasidagi terassadan shahar ko'rinadi.","tianjinlib":"Tyanszindagi futuristik kutubxona (2017): markazdagi sharsimon «Ko'z» atrofida to'lqinsimon oq javonlar shiftgacha ko'tariladi. Ijtimoiy tarmoqlarda eng ko'p tarqalgan kutubxonalardan biri.","alexandrina":"2002-yilda qadimgi Iskandariya kutubxonasi xotirasiga qurilgan bino — dengizga qiyshaygan quyosh diskiga o'xshaydi. Devorida dunyoning 120 alifbosidagi harflar o'yilgan.","libcongress":"Vashingtondagi dunyodagi eng katta kutubxona — 170 milliondan ortiq kitob, xarita va yozuvlar. Asosiy o'quv zali va bezakli Jefferson binosi ajoyib.","nypl":"Nyu-Yorkdagi Beshinchi avenyudagi marmar bino (1911) — kirishda «Sabr» va «Matonat» sherlari. «Rose» o'quv zali shiftidagi osmon freskalari mashhur.","strahov":"Pragadagi Straxov monastiri kutubxonasi — barokko uslubidagi «Teologiya» va «Falsafa» zallari, shiftdagi freskalar va qadimiy globuslar.","joanina":"Koimbra universitetidagi barokko kutubxona (1728) — oltin bilan qoplangan javonlar. Kechasi kitoblarni hasharotlardan himoya qiladigan ko'rshapalaklar yashaydi.","ateneo":"Buenos-Ayresdagi 1919-yilgi teatr binosi kitob do'koniga aylantirilgan — sahnada kafe, lojalarda o'qish joylari. Dunyodagi eng chiroyli kitob do'konlaridan biri.","qatarlib":"Dohadagi Rem Kolxas loyihasidagi milliy kutubxona (2017) — butun bino bitta ulkan zal, javonlar zinapoyalarga aylanadi. Million kitob va qadimiy qo'lyozmalar.","bodleian":"1602-yilda ochilgan Oksford universiteti kutubxonasi — Yevropadagi eng qadimgilaridan biri. Ilohiyot maktabi zali va Radklif rotondasi «Garri Potter» filmlarida ko'ringan.","realgabinete":"Rio-de-Janeyrodagi 1887-yilgi portugal o'qish zali: yog'och javonlar, rangli shisha shift va 350 mingdan ortiq kitob. Kirish bepul.","navoiylib":"Toshkentdagi Alisher Navoiy nomidagi O'zbekiston Milliy kutubxonasi — 2012-yilda qurilgan zamonaviy bino, millionlab kitob va qadimiy qo'lyozmalar.","kennedy":"Floridadagi NASA kosmik markazi: «Atlantis» shatli, 110 metrli Saturn V raketasi va astronavt simulyatorlari. Omadingiz kelsa, haqiqiy raketa uchishini ko'rasiz.","baikonur":"Qozog'istondagi dunyodagi birinchi va eng katta kosmodrom — 1961-yilda Yuriy Gagarin shu yerdan koinotga uchgan. Hozir ham «Soyuz» raketalari uchiriladi, maxsus turlar orqali tomosha qilish mumkin.","houstonspace":"NASA Jonson kosmik markazining tashrif markazi — missiyalarni boshqarish zali, Saturn V raketasi va shatlni tashigan Boeing 747. Astronavtlar shu yerda tayyorlanadi.","griffith":"Los-Anjeles tepaligidagi observatoriya (1935) — bepul teleskoplar, planetariy va Hollivud yozuvi bilan shahar manzarasi. «La La Land» filmida ko'ringan.","paranal":"Atakama cho'lidagi 2635 metrli tog' tepasidagi Yevropa observatoriyasi — 4 ta 8,2 metrli «Juda katta teleskop». Yilning 330 kechasi osmon ochiq.","atacama":"Chilidagi dunyodagi eng quruq cho'l — ba'zi joylarida yuzlab yillar yomg'ir yog'magan. Oy vodiysi, El Tatio geyzerlari va dunyodagi eng tiniq yulduzli osmon.","citespace":"Tuluzadagi kosmik tema parki: haqiqiy «Mir» stansiyasi, 53 metrli Ariane 5 raketasi, planetariy va astronavt mashg'ulotlari simulyatorlari.","maunakea":"Gavayidagi 4207 metrli so'ngan vulqon cho'qqisida dunyodagi eng katta teleskoplar joylashgan. Bulutlar ustida quyosh botishi va yulduzlarni tomosha qilish unutilmas.","ulugbek":"Mirzo Ulug'bek 1420-yillarda qurdirgan rasadxona — 40 metrli ulkan sekstant yordamida 1018 yulduz katalogi tuzilgan. Yil uzunligini hayratlanarli aniqlikda o'lchagan.","darvaza":"Qoraqum cho'lidagi 70 metrli gaz krateri 1971-yildan beri yonmoqda. Kechasi olov alangasi uzoqdan ko'rinadi — yonida chodirda tunab, cho'l osmonini tomosha qilish mumkin.","gardensbay":"Singapurdagi 101 gektarlik kelajak bog'i: 50 metrli «superdaraxtlar» kechasi yorug'lik va musiqa shousi bilan jonlanadi. «Bulut o'rmoni» gumbazi ichida yopiq sharshara bor.","jewel":"Changi aeroportidagi gumbaz ichida 40 metrli «Yomg'ir girdobi» — dunyodagi eng baland yopiq sharshara, atrofida tropik o'rmon. Parvoz oldidan ham borish mumkin.","shanghaitower":"632 metrli buralgan osmono'par — Xitoydagi eng baland bino. 118-qavatdagi kuzatuv maydoniga dunyodagi eng tez liftlardan biri 1 daqiqada olib chiqadi.","orientalpearl":"Huangpu daryosi bo'yidagi 468 metrli teleminora (1994) — pushti sharlari tufayli Shanxayning ramzi. Shisha poldan pastga qarash yuraksizlar uchun emas.","burjalarab":"Sun'iy orol ustidagi 321 metrli yelkan shaklidagi mehmonxona — «yetti yulduzli» deb ataladi. Ichidagi oltin bezaklar va ulkan atrium mashhur.","palmjumeirah":"Dubaydagi palma shaklidagi sun'iy orol — kosmosdan ko'rinadi. Uchida Atlantis mehmonxonasi va akvapark, monorelsdan orolni tepadan ko'rasiz.","dubaiframe":"150 metrli oltin ramka shaklidagi bino (2018). Tepasidagi shisha ko'prikdan bir tomonda eski Dubay, ikkinchi tomonda zamonaviy osmono'parlar ko'rinadi.","merdeka":"Kuala-Lumpurdagi 678,9 metrli osmono'par (2023) — dunyodagi ikkinchi eng baland bino. Shakli Malayziya mustaqilligi e'lon qilingan paytdagi qo'l harakatidan ilhomlangan.","taipei101":"508 metrli bambuk shaklidagi osmono'par. Ichidagi 660 tonnali oltin shar-mayatnik bino tebranishini kamaytiradi. Yangi yilda otashinlar shu bino bo'ylab otiladi.","lotteworld":"Seuldagi 555 metrli osmono'par — Koreyadagi eng baland bino. 118-qavatdagi shisha pol ustida turib, butun shahar va Xan daryosini ko'rasiz.","skytree":"634 metrli dunyodagi eng baland teleminora (2012). 450 metrdagi spiral «Osmon yo'lagi»dan ochiq kunda Fudzi tog'i ko'rinadi.","cntower":"Torontodagi 553 metrli minora — 30 yildan ortiq dunyodagi eng baland inshoot bo'lgan. Shisha pol va bino tashqarisida arqonga bog'lanib yuriladigan «EdgeWalk» mashhur.","empirestate":"1931-yilda 410 kunda qurilgan 443 metrli Art Deco osmono'par — «King Kong» filmidan tanish. 86 va 102-qavatlardagi kuzatuv maydonlaridan Nyu-York ko'rinadi.","summitone":"One Vanderbilt osmono'parining tepasidagi san'at makoni (2021): ko'zgu xonalari, shisha balkonlar va shisha liftlar. Oyoq ostingizda Manxetten.","sphere":"Las-Vegasdagi 112 metrli shar shaklidagi konsert zali (2023) — tashqi yuzasi butunlay LED ekran. Ichida 16K ekranli dunyodagi eng katta tomosha zali.","cloudgate":"Chikagodagi Millennium parkida turgan 110 tonnalik zanglamaydigan po'lat haykal (2006). Ko'zgudek yuzasida osmono'parlar va bulutlar aks etadi — xalq uni «Loviya» deb ataydi.","shard":"London ko'prigi yonidagi 310 metrli shisha piramida (2012) — Buyuk Britaniyadagi eng baland bino. 72-qavatdagi ochiq maydondan London kaftdagidek.","atomium":"1958-yilgi Bryussel ko'rgazmasi uchun qurilgan 102 metrli temir atomi modeli. 9 ta sharning ichida ko'rgazmalar, eng yuqorisida restoran.","elbphilharmonie":"Gamburgdagi eski g'isht ombor ustiga qurilgan to'lqinli shisha konsert zali (2017). Ochiq «Plaza»dan port va shahar manzarasi bepul ko'rinadi.","artsciences":"Santyago Kalatrava loyihasidagi oppoq futuristik majmua — ko'z shaklidagi Hemisferik, fan muzeyi, opera va Yevropaning eng katta akvariumi suv havzalari ustida.","lakhta":"Sankt-Peterburgdagi 462 metrli shisha nayza (2019) — Yevropadagi eng baland bino. Fin ko'rfazi bo'yidagi kuzatuv maydonidan Peterburg ko'rinadi.","bosco":"Milandagi ikki «vertikal o'rmon» minorasi (2014) — balkonlarida 900 daraxt va 20 ming o'simlik o'sadi. Fasllarga qarab bino rangi o'zgaradi.","heydaraliyev":"Zaha Hadid loyihasidagi madaniyat markazi (2012) — oppoq to'lqinsimon bino yer bilan qo'shilib ketgandek. Ichida muzey va konsert zali bor.","flametowers":"Bokudagi 182 metrgacha bo'lgan uchta minora — olov alangasi shaklida. Kechasi 10 mingdan ortiq LED chiroq ularni yonayotgan olovga aylantiradi.","bayterek":"Astanadagi 97 metrli monument — hayot daraxti shoxlarida qushlar qo'ygan oltin tuxum afsonasini tasvirlaydi. Tepasidagi sharda Nazarboyev qo'l izi bor.","khanshatyr":"Norman Foster loyihasidagi 150 metrli shaffof chodir (2010) — ichida yil bo'yi issiq, plyajli akvapark, do'konlar va ko'ngilochar markaz.","ashgabat":"Turkmaniston poytaxti — oq marmar bilan qoplangan binolar soni bo'yicha Ginnes rekordiga kirgan. Oltin haykallar, favvoralar va kechasi yoritilgan ko'chalar.","tashkenttower":"1985-yilda qurilgan 375 metrli teleminora — Markaziy Osiyodagi eng baland inshoot. 100 metr balandlikdagi aylanuvchi restorandan butun Toshkent ko'rinadi.","tashkentcity":"Toshkent markazidagi yangi biznes va dam olish majmuasi: osmono'parlar, Tashkent City bog'i, ko'l bo'yidagi musiqali favvoralar va kechasi yoritilgan xiyobonlar.","tashkentmetro":"1977-yilda ochilgan Markaziy Osiyodagi birinchi metro — har bir bekat alohida mavzuda: «Kosmonavtlar»da kosmik naqshlar, «Alisher Navoiy»da sharqona gumbazlar. 2018-yildan suratga olish ruxsat etilgan.","goldenbridge":"Ba Na tog'larida 1400 metr balandlikdagi 150 metrli oltin ko'prik (2018) — uni ikki ulkan «tosh qo'l» ko'tarib turadi. Bulutlar orasida yurgandek bo'lasiz.","masjidharam":"Makkadagi islomning eng muqaddas masjidi — o'rtasida Ka'ba turadi. Har yili millionlab musulmonlar haj va umra uchun keladi. Dunyodagi eng katta masjid.","masjidnabawi":"Madinadagi Payg'ambarimiz (s.a.v.) qurgan masjid — ikkinchi muqaddas masjid. Yashil gumbaz ostida Payg'ambarimiz qabri, hovlida ochilib-yopiladigan ulkan soyabonlar bor.","bluemosque":"Istanbuldagi 1616-yilda qurilgan olti minorali masjid. Ichi 20 mingdan ortiq Iznik koshinlari bilan bezatilgan — shuning uchun «Ko'k masjid» deyiladi. Ayasofya ro'parasida.","hassan2":"Kasablankadagi Atlantika okeani ustiga qurilgan masjid (1993) — 210 metrli minorasi dunyodagi eng balandlaridan. Shishasimon polining bir qismidan okean ko'rinadi.","nasirolmolk":"Sherozdagi XIX asr masjidi — ertalab quyosh nuri rangli vitrajlardan o'tib, gilamlar ustiga kamalak rangli naqsh to'kadi. Shuning uchun «Pushti masjid» deyiladi.","naqshejahan":"Isfahondagi XVII asr maydoni — dunyodagi eng kattalaridan biri. Atrofida Shoh masjidi, Shayx Lutfulloh masjidi va Ali Qopu saroyi. «Isfahon — dunyoning yarmi» degan maqol bor.","faisal":"Islomoboddagi 1986-yilgi masjid — an'anaviy gumbaz o'rniga badaviylar chodiri shaklida. 100 ming kishigacha sig'adi, Margalla tog'lari fonida ajoyib ko'rinadi.","kulsharif":"Qozon Kremli ichidagi masjid (2005) — 1552-yilda vayron qilingan masjid xotirasiga qurilgan. Moviy gumbaz va to'rtta minora Tatariston ramzi.","goldentemple":"Amritsardagi sikxlarning eng muqaddas ibodatxonasi — oltin bilan qoplangan bino muqaddas ko'l o'rtasida turadi. Oshxonasi kuniga 100 mingdan ortiq kishini bepul ovqatlantiradi.","lotustemple":"Dehlidagi bahoiylar ibodatxonasi (1986) — 27 ta oq marmar «gulbarg»dan iborat nilufar shaklida. Barcha din vakillari uchun ochiq.","borobudur":"IX asrda Yavada qurilgan dunyodagi eng katta buddaviylik ibodatxonasi — 9 qavatli piramida, 2672 ta tosh relyef va 504 Budda haykali. Tongda vulqonlar fonida sehrli.","watarun":"Bangkokdagi Chao Phraya daryosi bo'yidagi «Tong ibodatxonasi» — 70 metrli markaziy minorasi chinni va rangli shisha bo'laklari bilan bezatilgan.","notredame":"Parijdagi 1163-yilda qurila boshlagan gotik sobor. 2019-yilgi yong'indan keyin tiklanib, 2024-yil dekabrda qayta ochildi. Gargulyalar va rangli rozetka oynalari mashhur.","stpeters":"Vatikandagi dunyodagi eng katta cherkov — Mikelanjelo loyihalagan 136 metrli gumbaz. Ichida Mikelanjeloning «Pieta» haykali, gumbaz tepasidan Rim ko'rinadi.","domerock":"Quddusdagi Masjidul Aqso hovlisida turgan 691-yildagi bino — islom me'morchiligining eng qadimgi saqlangan durdonasi. Oltin gumbazi shaharning ramzi.","bibikhanym":"Amir Temur Hindiston yurishidan keyin qurdirgan ulkan jome masjidi (1399–1404). O'z davrida dunyodagi eng katta masjidlardan biri bo'lgan, moviy gumbazi qayta tiklangan.","hastimam":"Toshkentning diniy markazi: Barakxon madrasasi, Hazrati Imom jome masjidi va Muyi Muborak kutubxonasi — unda VII asrga oid Usmon Mushafi saqlanadi.","minor":"Anhor kanali bo'yidagi oppoq marmar masjid (2014) — 2400 kishiga mo'ljallangan. Moviy gumbazi va oqshom yoritilishi bilan Toshkentning eng chiroyli masjidlaridan biri.","naqshband":"Buxoro yaqinidagi naqshbandiya tariqati asoschisi Bahouddin Naqshband (1318–1389) maqbarasi — Markaziy Osiyoning eng muqaddas ziyoratgohlaridan biri. Hovli va bog'lar juda sokin.","versailles":"Parij yaqinidagi Fransiya qirollari saroyi — 357 ta ko'zguli «Oynalar zali», oltin bezaklar va 800 gektarlik bog'lar favvoralari bilan. YuNESKO obidasi.","alhambra":"Granadadagi XIII–XIV asr Nasriylar saroyi — o'yma naqshlar, sherli favvorali hovli va Generalife bog'lari. Arab-andalus san'atining eng go'zal namunasi.","forbiddencity":"Pekin markazidagi 72 gektarlik saroy majmuasi — 1420–1912-yillarda 24 imperator yashagan. Oddiy odamlarga kirish taqiqlangani uchun shunday nom olgan.","schonbrunn":"Venadagi Gabsburglar yozgi saroyi — 1441 xona, barokko bog'lar va tepalikdagi Glorietta. Imperatritsa Sissi shu yerda yashagan.","buckingham":"Londondagi Britaniya monarxining rasmiy qarorgohi — 775 xona. Yozda davlat xonalari ochiladi, saroy oldida qorovul almashinuvi marosimi bo'ladi.","peterhof":"Sankt-Peterburg yaqinidagi Pyotr I saroyi — «Katta kaskad» favvorasi oltin haykallar bilan, jami 150 dan ortiq favvora. Fin ko'rfazi bo'yidagi bog'lar.","pena":"Sintra tog'i tepasidagi rang-barang romantik saroy (1854) — sariq, qizil va moviy minoralar. Bulutli kunda saroy osmonda suzayotgandek ko'rinadi.","himeji":"Yaponiyadagi eng go'zal va eng yaxshi saqlangan samuray qal'asi (1609) — oppoq devorlari uchun «Oq laylak» deyiladi. Bahorda sakura gullari bilan o'ralgan.","topkapi":"Istanbuldagi Usmonli sultonlari saroyi (1478) — haram, xazina (86 karatlik olmos) va muqaddas yodgorliklar. Bog'idan Bosfor ko'rinadi.","grandpalace":"Bangkokdagi Tailand qirollari saroyi (1782) — oltin minoralar va Zumrad Budda ibodatxonasi. Kirishda yelka va tizzani yopadigan kiyim talab qilinadi.","gyeongbokgung":"Seuldagi Choson sulolasining bosh saroyi (1395). Xanbok kiyib kelganlar bepul kiradi. Qorovul almashinuvi marosimi va ko'l ustidagi pavilyon mashhur.","kremlin":"Moskva markazidagi qizil g'ishtli qal'a — ichida soborlar, Qurol palatasi va Tsar-qo'ng'iroq. Yonidagi Qizil maydonda rang-barang Avliyo Vasiliy sobori turadi.","potala":"Lxasadagi 3700 metr balandlikdagi 13 qavatli saroy — Dalay-lamalar qarorgohi bo'lgan. 1000 dan ortiq xona va oltin qabrlar.","ark":"Buxoro markazidagi ming yillardan beri turgan qal'a — 1920-yilgacha amirlar qarorgohi bo'lgan. Ichida muzeylar, devoridan butun eski shahar ko'rinadi.","khudayar":"Qo'qon xoni Xudoyorxon qurdirgan saroy (1871) — rang-barang koshinlar bilan bezatilgan fasad va 7 ta hovli. Hozir o'lkashunoslik muzeyi.","sitorai":"Buxoro amirining XIX–XX asr boshidagi yozgi saroyi — rus va sharq uslublari aralash. Oq zal, oyna bezaklar va tovuslar yuradigan bog'.","disneyparis":"Parij yaqinidagi Yevropadagi eng mashhur tema parki — «Uyqudagi go'zal» qasri, ertak qahramonlari paradi va kechqurungi otashinlar. Ikkita park va mehmonxonalar.","magickingdom":"Floridadagi dunyodagi eng ko'p tashrif buyuriladigan tema parki — Zolushka qasri, attraksionlar va kechki otashin shousi. Walt Disney World'ning yuragi.","tivoli":"Kopengagen markazidagi 1843-yilgi o'yin parki — 1914-yildan beri ishlayotgan yog'och tepalik attraksioni, bog'lar va kechasi minglab chiroqlar. Disneyga ilhom bergan.","europapark":"Germaniyadagi Yevropaning eng yaxshi tema parklaridan biri — 15 ta Yevropa mamlakati uslubidagi hududlar, 100 dan ortiq attraksion va 13 ta tepalik.","keukenhof":"Niderlandiyadagi 32 gektarlik gul bog'i — har bahorda (mart oxiri–may) 7 milliondan ortiq lola, nargis va sumbul gullaydi. Atrofdagi rang-barang lola dalalari ham ajoyib.","butchart":"Kanadaning Vankuver orolidagi bog'lar — 1904-yilda eski ohaktosh karyeri o'rnida yaratilgan Cho'kma bog'. Yozda kechqurun otashinlar bo'ladi.","centralpark":"Manxetten markazidagi 341 gektarlik park (1858) — ko'llar, ko'priklar, qishda konkida uchish maydoni va yuzlab filmlarda ko'ringan xiyobonlar.","miraclegarden":"Dubaydagi 150 million gul bilan bezatilgan bog' — gullardan yasalgan Airbus A380 samolyoti va ulkan qal'alar. Faqat qish mavsumida (noyabr–aprel) ochiq.","ashikaga":"Yaponiyadagi gullar parki — 160 yillik ulkan glitsiniya daraxti binafsha gullari bilan soyabondek yoyiladi. Aprel–mayda eng go'zal, qishda esa yorug'lik festivali.","efteling":"Niderlandiyadagi 1952-yildan beri ishlayotgan ertak parki — «Ertaklar o'rmoni»da Grimm ertaklari qahramonlari jonlanadi. Disneylenddan ham qadimiy.","acropolis":"Afina tepasidagi miloddan avvalgi V asr majmuasi — Parfenon, Erexteyon va kariatidalar. G'arb sivilizatsiyasi, demokratiya va falsafaning ramzi.","stonehenge":"Angliyadagi miloddan avvalgi 3000-yillarga oid ulkan tosh halqa. Yozgi quyosh turishi kuni quyosh aynan toshlar orasidan chiqadi. Qanday qurilgani hali ham sir.","pompeii":"Milodiy 79-yilda Vezuviy vulqoni kuli ostida qolgan Rim shahri. Ko'chalar, uylar, freskalar va odamlarning gips qoliplari — vaqt to'xtab qolgandek.","pisa":"Piza soborining 56 metrli qo'ng'iroqxonasi — qurilish paytidayoq yumshoq yer tufayli qiyshaygan. Qiyalik 4 gradusga yaqin, 296 zinadan tepasiga chiqish mumkin.","brandenburg":"Berlindagi 1791-yilgi neoklassik darvoza — Sovuq urush paytida devor yonida qolgan, 1989-yildan Germaniya birlashuvi ramziga aylangan.","bigben":"Vestminster saroyining 96 metrli soat minorasi (1859). «Big Ben» aslida ichidagi 13 tonnalik qo'ng'iroq nomi. Temza bo'yidan eng chiroyli ko'rinadi.","libertystatue":"Fransiya 1886-yilda sovg'a qilgan 93 metrli haykal — Amerikaga kelgan millionlab muhojirlarni kutib olgan. Tojigacha chiqib, Manxettenni ko'rish mumkin.","terracotta":"Xitoyning birinchi imperatori Qin Shixuandi qabrini qo'riqlash uchun yasalgan 8000 dan ortiq loy jangchi (miloddan avvalgi III asr). Har birining yuzi boshqacha.","easterisland":"Tinch okeanining o'rtasidagi Rapa-Nui oroli — 900 dan ortiq ulkan tosh boshlar (moai). Ahu Tongariki'dagi 15 ta moai ortidan quyosh chiqishi mashhur.","teotihuacan":"Mexiko yaqinidagi qadimiy shahar — 65 metrli Quyosh ehromi va Oy ehromi «O'liklar xiyoboni» bilan bog'langan. Tongda havo sharidan ko'rish mumkin.","tikal":"Gvatemala junglisidagi mayya shahri — 70 metrli ehromlar daraxtlar ustidan chiqib turadi. Tongda maymunlar va to'tiqushlar ovozi ostida tomosha qiling.","persepolis":"Eronda miloddan avvalgi 518-yilda Doro I qurdirgan Ahamoniylar poytaxti. Zinalardagi turli xalqlar elchilari tasvirlangan relyeflar hayratlanarli saqlangan.","sigiriya":"Shri-Lankadagi 180 metrli qoya tepasiga V asrda qurilgan qal'a. Kirish joyida ulkan sher panjalari, yo'lda qadimiy freskalar va ko'zgu devor.","hampi":"Hindistondagi Vijayanagara imperiyasining XIV–XVI asr poytaxti — ulkan toshlar orasida 1600 dan ortiq xaroba, tosh arava va Virupaksha ibodatxonasi.","ephesus":"Turkiyadagi qadimiy Rim shahri — Selsiy kutubxonasi fasadi, 25 ming o'rindiqli teatr va marmar ko'chalar. Yaqinida Artemida ibodatxonasi xarobasi.","ayazkala":"Qoraqalpog'istondagi Qadimgi Xorazmning «Ellik qal'a»sidan biri — tepalik ustidagi miloddan avvalgi IV asr qal'asi. Yonida o'tov-lagerda tunab, cho'l quyosh botishini kuzatish mumkin.","termez":"Amudaryo bo'yidagi 2500 yillik shahar — Fayoztepa va Qoratepa buddaviylik majmualari, Sulton Saodat ansambli va Hakim at-Termiziy maqbarasi.","moynaq":"Bir paytlar Orol dengizining baliqchilik porti bo'lgan shahar — dengiz chekingach, kemalar qumda qolib ketdi. Kemalar qabristoni va Orol muzeyi ekologik fojia haqida so'zlaydi. Har yili «Stihia» musiqa festivali o'tadi.","dolomites":"Shimoliy Italiyadagi YuNESKO tog'lari — Tre Chime cho'qqilari, Seceda tizmasi va Braies ko'li. Yozda piyoda yo'llar, qishda chang'i.","faroe":"Shimoliy Atlantikadagi 18 ta vulqon oroli — okeanga to'g'ridan-to'g'ri tushadigan Mulafossur sharsharasi, okean ustidagi Sorvagsvatn ko'li va qo'ylar ko'p.","highlands":"Shotlandiya tog'lari — Glenko vodiysi, Ben-Nevis cho'qqisi va Loch-Ness ko'li. «Garri Potter» filmidagi Glenfinnan viadukidan bug' poyezdi o'tadi.","baikal":"Sibirdagi dunyodagi eng chuqur (1642 m) va eng qadimgi ko'l — Yer chuchuk suvining 20 foizi shu yerda. Qishda shisha kabi tiniq muz ustida yurish mumkin.","kamchatka":"Rossiyaning uzoq sharqidagi 300 dan ortiq vulqonli yarim orol — Geyzerlar vodiysi, qo'ng'ir ayiqlar baliq ovlaydigan daryolar va issiq buloqlar.","baobabs":"Madagaskardagi 800 yillik ulkan baobab daraxtlari xiyoboni — balandligi 30 metrgacha. Quyosh botishida daraxtlar siluyeti sehrli manzara yaratadi.","socotra":"Yamanga qarashli orol — o'simliklarining uchdan biri dunyoning boshqa joyida uchramaydi. Soyabon shaklidagi «Ajdar qoni» daraxtlari o'zga sayyoradagidek.","okavango":"Kalaxari cho'li o'rtasidagi ulkan ichki delta — mokoro qayig'ida fillar, begemotlar va sherlar orasida suzasiz. YuNESKO obidasi.","roraima":"Venesuela, Braziliya va Gayana chegarasidagi 2810 metrli stolsimon tog' — tepasi bulutlar ustida. Konan Doylning «Yo'qolgan dunyo» romaniga ilhom bergan.","titicaca":"And tog'larida 3812 metr balandlikdagi ko'l — Uros xalqining qamishdan yasalgan suzuvchi orollari va Inklar afsonalari bilan mashhur.","rainbowmountain":"Peru Andlaridagi 5200 metrli tog' — minerallar uni qizil, sariq, yashil va binafsha yo'l-yo'llarga bo'yagan. Kuskodan bir kunlik sayohat.","cenote":"Chichen-Itsa yaqinidagi 26 metr chuqurlikdagi tabiiy quduq — tepadan liana va ildizlar osilib turadi, moviy suvda suzish mumkin.","havana":"Kuba poytaxtining eski shahri — rang-barang mustamlaka binolari, 1950-yillar amerika avtomobillari, salsa musiqasi va Malekon sohili.","cartagena":"Kolumbiyaning Karib dengizi bo'yidagi devor bilan o'ralgan shahri — gulli balkonlar, rang-barang ko'chalar va San-Felipe qal'asi.","antarctica":"Dunyoning eng janubiy qit'asi — Lemer bo'g'ozida aysberglar orasidan suzasiz, pingvinlar koloniyalari va kitlarni ko'rasiz. Faqat yozda (dekabr–fevral) kemada boriladi.","marrakech":"Marokashning «qizil shahri» markazidagi Jamaa al-Fna maydoni — kunduzi ilon o'ynatuvchilar, kechasi yuzlab ovqat chodirlari. Atrofda labirintdek bozorlar.","lisbon":"Portugaliya poytaxti — Tejo daryosi bo'yidagi Belen minorasi (1519), sariq tramvaylar, tepaliklardagi ko'zgu-nuqtalar va pastel de nata pirojnoe.","tbilisi":"Gruziya poytaxti — Narikala qal'asi ostida yog'och balkonli eski shahar, gumbazli oltingugurtli hammomlar va zamonaviy Tinchlik ko'prigi.","almatymedeu":"Olmaota yaqinidagi 1691 metr balandlikdagi mashhur muz maydoni — 120 dan ortiq jahon rekordi shu yerda o'rnatilgan. Yuqorida Shimbuloq chang'i kurorti.","kolsai":"Shimoliy Tyan-Shandagi uchta tog' ko'li — archazor o'rmonlar orasida. Yonida Qayindi ko'li ham bor, otda sayr qilish mumkin.","iskanderkul":"Tojikistonning Fon tog'laridagi 2195 metr balandlikdagi firuza ko'l — rivoyatga ko'ra, Iskandar Zulqarnayn nomi bilan bog'liq. Yaqinida 38 metrli sharshara.","pamir":"Tojikistondan o'tadigan 1200 km lik baland tog' yo'li — Ak-Baytal dovonida 4655 metrga ko'tariladi. Dunyodagi eng baland xalqaro avtomobil yo'llaridan biri.","songkol":"Qirg'izistonda 3016 metr balandlikdagi ko'l — yozda cho'ponlar o'tov tikib, yilqi boqadi. O'tovda tunab, sut va qimiz tatib ko'rish mumkin.","alaarcha":"Bishkekdan 40 km janubdagi tog' darasi — muzliklar, sharsharalar va 4895 metrli Semyonov-Tyan-Shanskiy cho'qqisi. Bir kunlik sayr uchun ideal.","chimgan":"Toshkentdan 85 km uzoqlikdagi 3309 metrli Katta Chimyon tog'i etagidagi kurort. Yozda piyoda sayr va otda yurish, qishda chang'i. Yaqinida Amirsoy kurorti.","aydarkul":"Qizilqum cho'lidagi 3000 kv.km lik sun'iy ko'l — baliq ovi, tuyada sayr va o'tov lagerida tunash. Kechasi cho'l osmonida son-sanoqsiz yulduzlar.","zaamin":"Turkiston tizmasidagi 1926-yilda tashkil etilgan qo'riqxona — ming yillik archalar, toza tog' havosi va sanatoriylar. «O'zbekiston Shveytsariyasi» deb ataladi.","nuratau":"Navoiy va Jizzax oralig'idagi tog'lar — Sentob kabi qishloqlardagi mehmon uylari, yong'oqzorlar va qadimiy petrogliflar. Nurota shahrida Chashma bulog'i bor.","chorsu":"Toshkentning eski shahar qismidagi ulkan moviy gumbazli bozor — ziravorlar, quruq mevalar, non va milliy taomlar. Atrofida Ko'kaldosh madrasasi."},"IMG":{"registan":[141938104,138636269,141939853],"itchan":[177463086,177014240,177268802],"kalon":[140128345,74510858,74510859],"charvak":[194864606,132095338,132227440],"issyk":[143368663,149572803,149169516],"charyn":[143020517,143020515,143020522],"santorini":[177605131,50364969,25773685],"eiffel":[21375035,3531130,3239606],"machu":[43170390,8123877,43170413],"maldives":[59560925,116203647,47805079,59560920],"fuji":[164228977],"burj":[82789105,113514498,84361497],"taj":[11293223,21801419],"canyon":[28507310,138088856,25251680],"wall":[32396893,13258852,11726877],"cappadocia":[12709195,88451467,12696932],"venice":[156646328,63018640,43315781],"petra":[17901222,13267512,8759284],"wadirum":[8632484,78789274],"borabora":[45332089],"banff":[3064142,78702631],"moraine":[30268346,334627],"colosseum":[152009086,2127844,17076265],"kyoto":[83047725,85860114],"zhangjiajie":[22046362,22068720],"iguazu":[8357967 function speak(text,btn){

  const lc=TTSL[LANG]||"en-US"; const vs=S.getVoices(); const two=lc.slice(0,2);
  let v=vs.find(x=>x.lang.replace("_","-").toLowerCase()===lc.toLowerCase())||vs.find(x=>x.lang.toLowerCase().startsWith(two));
  const u=new SpeechSynthesisUtterance(String(text).replace(/[*#_]/g,"").slice(0,3000));
  if(!v&&vs.length){ v=(LANG==="uz")?(vs.find(x=>/^tr/i.test(x.lang))||vs.find(x=>/^ru/i.test(x.lang))):(vs.find(x=>/^ru/i.test(x.lang))||vs.find(x=>/^tr/i.test(x.lang))); if(!TTSWARN){ TTSWARN=true; toast(t("tts_fb")); } }
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang=lc;
